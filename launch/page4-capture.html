<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page 4 — Date Batch Capture</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;color:#f6f1db;background:#10243a}
body{margin:0;background:linear-gradient(#173f67,#0b1726);min-height:100vh}
main{max-width:820px;margin:auto;padding:22px}
a{color:#ffda7e}
button{background:#efc75d;color:#172b42;padding:14px 20px;border:0;border-radius:10px;font-weight:800;font-size:1rem}
p{line-height:1.5;color:#d9e4ed}
article{background:#183752;border:1px solid #53718a;padding:14px;margin:12px 0;border-radius:12px}
article h2{font-size:1.1rem;margin:.1rem 0 .4rem;color:#ffda7e}
article p{margin:.3rem 0}
#status{background:#183752;padding:12px;border-radius:10px}
</style>
</head>
<body>
<main>
<small>FLICK TO SORT · PAGE 4 · DATE BATCHES</small>
<h1>Date Batch Capture</h1>
<p>Finding dates from the last year with at least 50 photos, using each photo’s original capture date.</p>
<p id="status" role="status" aria-live="polite">Starting automatic phone scan…</p>
<button id="rescan" type="button" hidden>Scan again</button>
<section id="results" aria-live="polite"></section>
<p><a href="https://chunter.onrender.com/">Back to launcher</a></p>
</main>
<script>
const scanner='http://127.0.0.1:3015';
const status=document.querySelector('#status'),results=document.querySelector('#results'),rescan=document.querySelector('#rescan');
function localDateKey(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return y+'-'+m+'-'+d}
function priorYear(date){const result=new Date(date);result.setFullYear(result.getFullYear()-1);return result}
function dateLabel(key){const parts=key.split('-').map(Number);return new Date(parts[0],parts[1]-1,parts[2]).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}
async function scan(){
  rescan.hidden=true;results.replaceChildren();status.textContent='Scanning all phone picture folders for original capture dates…';
  const today=new Date(),since=localDateKey(priorYear(today)),through=localDateKey(today);
  try{
    const response=await fetch(scanner+'/api/date-batch-dates?since='+encodeURIComponent(since)+'&through='+encodeURIComponent(through)+'&minimum=50',{cache:'no-store'});
    if(!response.ok){
      if(response.status===404)throw new Error('The phone server is V47. Start the V48 scanner once, then reload Page 4.');
      const detail=await response.json().catch(()=>({}));
      throw new Error(detail.error||'Phone scan failed ('+response.status+').');
    }
    const data=await response.json(),dates=Array.isArray(data.dates)?data.dates:[];
    status.textContent='Scanned '+data.scanned+' phone photos · '+dates.length+' dates with 50 or more photos · last year';
    if(!dates.length){const empty=document.createElement('p');empty.textContent='No dates in the past year have 50 or more photos.';results.append(empty)}
    dates.forEach((item,index)=>{
      const card=document.createElement('article'),heading=document.createElement('h2'),summary=document.createElement('p');
      heading.textContent='Group '+(index+1)+' — '+dateLabel(item.date);
      summary.textContent=item.count+' photos taken on this date';
      card.append(heading,summary);results.append(card)
    });
  }catch(error){
    status.textContent=error.message==='Failed to fetch'
      ?'Could not reach the phone scanner. Start PicSorter V48 in Termux, then reload Page 4.'
      :error.message;
  }
  rescan.hidden=false;
}
rescan.addEventListener('click',scan);
scan();
</script>
</body>
</html>
