<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Tree — Sign In</title><style>:root{color-scheme:dark;--bg:#0b0c10;--panel:#151821;--ink:#f5f2e9;--muted:#aaa9a5;--line:#303542;--gold:#f0b44d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% -20%,#252c3e 0,transparent 42%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.box{width:min(92%,460px);padding:38px;border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 24px 80px #0008}.lock{font-size:34px}h1{font:900 48px/1 Georgia,serif;margin:10px 0 12px}p{color:var(--muted);line-height:1.5}label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:20px 0 8px}input{width:100%;padding:15px 16px;border-radius:12px;border:1px solid #424958;background:#0e1117;color:#fff;font-size:18px;outline:none}input:focus{border-color:var(--gold)}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--gold);color:#17120a;font-weight:900;font-size:16px;cursor:pointer}.small{font-size:12px}.notice{display:none;color:#ffd995;border:1px solid #72552a;background:#3d2d17;padding:12px;border-radius:12px;margin-top:16px}</style></head><body><main class="box"><div class="lock">🔒</div><h1>Family Tree</h1><p>Private family archive. Sign in to continue.</p><form id="login"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" autofocus required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form><p id="notice" class="notice">The protected Family Tree server still needs to be connected before sign-in can open the private records.</p><p class="small">The family records themselves remain in the private repository and are not embedded in this public entrance page.</p></main><script>document.getElementById('login').addEventListener('submit',function(e){e.preventDefault();document.getElementById('notice').style.display='block';});</script></body></html>
